# Modified by sytuacmdyh for Git Graph YZC: Open VSX-only releases.
name: Release for Cursor (Open VSX)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Open VSX (requires OVSX_PAT and a commit on main)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-branch:
    runs-on: ubuntu-latest
    outputs:
      on-main: ${{ steps.check.outputs.on-main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "on-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on-main=false" >> "$GITHUB_OUTPUT"
          fi

  package-and-publish:
    needs: check-branch
    if: github.event_name == 'workflow_dispatch' || needs.check-branch.outputs.on-main == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install git-flow
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git-flow

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install webview dependencies
        run: cd webview-ui && npm ci

      - name: Verify release tag matches package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const expected = "v" + require("./package.json").version; if (process.env.RELEASE_TAG !== expected) { throw new Error("Release tag must match package.json version: " + expected); }'

      - name: Type check
        run: npm run lint && npm --prefix webview-ui run check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-graph-yzc-${{ github.run_id }}
          path: '*.vsix'
          if-no-files-found: error

      - name: Extract changelog
        if: github.event_name == 'push'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## $VERSION/{p=1; next} /^## [0-9]/{if(p) exit} p" CHANGELOG.md > release_notes.txt

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          body_path: release_notes.txt
          token: ${{ github.token }}

      - name: Publish to Open VSX
        if: needs.check-branch.outputs.on-main == 'true' && (github.event_name == 'push' || (inputs.publish && github.ref == 'refs/heads/main'))
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::Configure the OVSX_PAT repository secret before publishing to Open VSX. The VSIX is available in this run's artifacts."
            exit 1
          fi
          npx --yes ovsx publish *.vsix
